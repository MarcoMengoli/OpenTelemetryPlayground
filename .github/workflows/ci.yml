name: Playground CI

on:
  pull_request:
  push:
    branches: [main, 'codex/integration-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test architectural guard
        run: python3 -B -m unittest discover -s .github/tests -v

  portability:
    name: Offline portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Process identity, paths with spaces and safety regressions (no broker)
        shell: pwsh
        run: ./scripts/test-platform.ps1
      - name: Restore, build and offline tests (not full macOS runtime validation)
        shell: pwsh
        run: |
          dotnet restore --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build --no-restore -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet test --no-build -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed' }

  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAB_CI_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require US02 foundation
        shell: bash
        run: |
          for file in global.json OpenTelemetryPlayground.slnx scripts/lab.ps1; do
            if [ ! -f "$file" ]; then
              echo "::error::US02 dependency missing: $file. Build and integration tests are NOT verified."
              exit 1
            fi
          done
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Check baseline architecture including resolved dependencies
        run: python3 .github/scripts/check_architecture.py --require-restored
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test contracts and foundation
        run: dotnet test --no-build -c Release
      - name: Start isolated laboratory
        id: laboratory
        shell: pwsh
        run: ./scripts/lab.ps1 start -Name $env:LAB_CI_NAME -PortBase 18300
      - name: Check readiness
        shell: pwsh
        run: ./scripts/lab.ps1 ready -Name $env:LAB_CI_NAME -PortBase 18300
      - name: Verify hosts and real RabbitMQ transfer
        shell: pwsh
        run: ./scripts/lab.ps1 verify -Name $env:LAB_CI_NAME -PortBase 18300
      - name: Stop isolated laboratory
        if: ${{ always() && steps.laboratory.outcome != 'skipped' }}
        shell: pwsh
        run: |
          if (Test-Path ".local/$env:LAB_CI_NAME/owner.json") {
            ./scripts/lab.ps1 stop -Name $env:LAB_CI_NAME -PortBase 18300
          }
      - name: Preserve laboratory logs
        if: ${{ always() && steps.laboratory.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laboratory-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/${{ env.LAB_CI_NAME }}/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Reset only this laboratory
        if: ${{ always() && steps.laboratory.outcome != 'skipped' }}
        shell: pwsh
        run: |
          if (Test-Path ".local/$env:LAB_CI_NAME/owner.json") {
            ./scripts/lab.ps1 reset -Name $env:LAB_CI_NAME -PortBase 18300
          }
      - name: Verify complete ecommerce twice
        id: ecommerce
        shell: pwsh
        run: ./scripts/e2e.ps1 -Name us10-${{ github.run_id }}-${{ github.run_attempt }} -PortBase 18500 -NoBuild
      - name: Preserve end-to-end evidence
        if: ${{ always() && steps.ecommerce.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecommerce-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/e2e-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Execute documented delivery walkthroughs
        shell: pwsh
        run: |
          $guide = Get-Content docs/getting-started.md -Raw
          $examples = [regex]::Matches($guide, '(?s)<!-- delivery-example:start -->\s*```powershell\s*\r?\n(.*?)\r?\n```\s*<!-- delivery-example:end -->')
          if ($examples.Count -ne 2) { throw 'Missing executable delivery examples; walkthrough NOT verified.' }
          foreach ($example in $examples) {
            try { . ([scriptblock]::Create($example.Groups[1].Value)) }
            finally {
              # The manual guide intentionally leaves its fresh environment running.
              # Cleanup belongs to this automated CI wrapper only.
              if ((Test-Path variable:root) -and (Test-Path -LiteralPath (Join-Path $root 'owner.json'))) {
                try { ./scripts/lab.ps1 stop -Name $name -PortBase $portBase }
                finally { ./scripts/lab.ps1 reset -Name $name -PortBase $portBase }
              }
            }
          }
